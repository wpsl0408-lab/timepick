<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimePick - 로그인</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(160deg, #2D4B9B 0%, #4A90E2 100%);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Pretendard', -apple-system, sans-serif;

            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-logo {
            font-size: 42px;
            font-weight: 900;
            color: white;

            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .login-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);

            line-height: 1.6;
            margin-bottom: 36px;
        }

        .login-card {
            background: white;
            border-radius: 28px;

            padding: 36px 28px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 800;

            color: #1e293b;

            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            color: #64748b;

            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border: 1.5px solid #e2e8f0;
            border-radius: 14px;

            font-size: 14px;
            color: #1e293b;

            outline: none;

            transition: all 0.2s ease;

            background: white;
        }

        .input-field:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.12);
        }

        /* 비밀번호 영역 */
        .pw-wrap {
            position: relative;
        }

        .pw-wrap .input-field {
            padding-right: 48px;
        }

        .pw-toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            width: 24px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: none;

            cursor: pointer;

            color: #94a3b8;
            font-size: 16px;

            padding: 0;
        }

        .role-label {
            display: block;

            text-align: left;

            font-size: 13px;
            font-weight: 700;

            color: #64748b;

            margin-bottom: 10px;
        }

        .role-row {
            display: flex;
            gap: 12px;

            margin-bottom: 24px;
        }

        .role-btn {
            flex: 1;

            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            border: 2px solid #e2e8f0;
            border-radius: 14px;

            background: white;

            font-size: 14px;
            font-weight: 700;

            color: #64748b;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .role-btn.active {
            border-color: #2D4B9B;
            background: #eff6ff;
            color: #2D4B9B;
        }

        .login-btn {
            width: 100%;
            height: 56px;

            border: none;
            border-radius: 16px;

            background: linear-gradient(135deg, #2D4B9B, #4A90E2);

            color: white;

            font-size: 17px;
            font-weight: 800;

            cursor: pointer;

            transition: transform 0.15s ease;

            box-shadow: 0 8px 24px rgba(45, 75, 155, 0.25);

            margin-bottom: 20px;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .demo-hint {
            background: #f8fafc;

            border-radius: 14px;

            padding: 14px;

            text-align: left;

            font-size: 13px;
            color: #64748b;

            line-height: 1.8;
        }

        .demo-hint strong {
            color: #2D4B9B;
        }
    </style>
</head>

<body>
    <div class="login-wrap">

        <h1 class="login-logo">⏱ TimePick</h1>

        <p class="login-subtitle">
            실시간 대기 기반<br />
            스마트 맛집 플랫폼
        </p>

        <div class="login-card">

            <h2>로그인</h2>

            <!-- 이메일 -->
            <div class="input-group">
                <label class="input-label">이메일</label>

                <input
                    class="input-field"
                    type="text"
                    id="email"
                    placeholder="이메일 입력"
                    autocomplete="off"
                />
            </div>

            <!-- 비밀번호 -->
            <div class="input-group">

                <label class="input-label">비밀번호</label>

                <div class="pw-wrap">

                    <input
                        class="input-field"
                        type="password"
                        id="password"
                        placeholder="비밀번호 입력"
                        autocomplete="off"
                    />

                    <button
                        class="pw-toggle"
                        type="button"
                        id="pwToggle"
                        onclick="togglePw()"
                    >
                        👁
                    </button>

                </div>
            </div>

            <!-- 역할 선택 -->
            <span class="role-label">로그인 유형</span>

            <div class="role-row">

                <button
                    class="role-btn active"
                    id="roleUser"
                    onclick="selectRole('user')"
                >
                    👤 손님
                </button>

                <button
                    class="role-btn"
                    id="roleOwner"
                    onclick="selectRole('owner')"
                >
                    🏪 사장님
                </button>

            </div>

            <!-- 로그인 버튼 -->
            <button class="login-btn" onclick="login()">
                로그인하기
            </button>

            <!-- 데모 계정 -->
            <div class="demo-hint">

                💡 <strong>데모 계정</strong><br />

                손님: user@test.com / 1234<br />
                사장님: owner@test.com / 1234

            </div>

        </div>
    </div>

    <script>
        let selectedRole = "user";
        let pwVisible = false;

        // 비밀번호 보이기/숨기기
        function togglePw() {

            pwVisible = !pwVisible;

            const input = document.getElementById("password");
            const btn = document.getElementById("pwToggle");

            if (pwVisible) {
                input.type = "text";
                btn.textContent = "🙈";
            } else {
                input.type = "password";
                btn.textContent = "👁";
            }
        }

        // 역할 선택
        function selectRole(role) {

            selectedRole = role;

            document
                .getElementById("roleUser")
                .classList.toggle("active", role === "user");

            document
                .getElementById("roleOwner")
                .classList.toggle("active", role === "owner");
        }

        // 로그인
        function login() {

            const email = document
                .getElementById("email")
                .value
                .trim();

            const password = document
                .getElementById("password")
                .value
                .trim();

            if (!email || !password) {

                alert("이메일과 비밀번호를 입력해주세요!");
                return;
            }

            localStorage.setItem("role", selectedRole);
            localStorage.setItem("email", email);
            localStorage.setItem("loggedIn", "true");

            if (selectedRole === "owner") {
                location.href = "owner.html";
            } else {
                location.href = "main.html";
            }
        }
    </script>
</body>
</html>
